name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Windows packages
        run: npm run build:win

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "dist/$($_.Name).sha256"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SME-ERP-Setup-*.exe
            dist/SME-ERP-Portable-*.exe
            dist/*.sha256
            dist/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Windows 다운로드

            - 설치형: `SME-ERP-Setup-*.exe`
            - 무설치형(포터블): `SME-ERP-Portable-*.exe`
            - 무결성 확인: 각 exe에 첨부된 `.sha256` 파일과 `Get-FileHash`(SHA256) 값을 대조하세요.

            > 처음 실행 시 Windows SmartScreen 경고가 뜰 수 있습니다(코드 서명 없는 무료 오픈소스).
            > 경고창에서 **[추가 정보] → [실행]**으로 진행하세요.
            > 자세한 안내: `docs/growth/SMARTSCREEN_FAQ.md`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
